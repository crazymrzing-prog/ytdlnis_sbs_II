
name: Android CI

env:
  main_project_module: app

permissions: {}

on:
  push:
    branches:
      - "**"
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: github
            task: assembleGithubRelease
            display_name: github
          - flavor: foss
            task: assembleFossRelease
            display_name: FOSS
          - flavor: izzy
            task: assembleIzzyRelease
            display_name: Izzy

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: corretto
          cache: gradle

      - name: Configure Keystore & Properties
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          : > local.properties
          : > keystore.properties
          if [ -n "$BASE_64_SIGNING_KEY" ] && [ -n "$LOCAL_PROPERTIES" ]; then
            printf '%s' "$BASE_64_SIGNING_KEY" | base64 -d > app/release_keystore.jks
            printf '%s' "$LOCAL_PROPERTIES" > keystore.properties
          fi
          chmod +x gradlew

      - name: Build ${{ matrix.flavor }} APK release
        run: ./gradlew ${{ matrix.task }} --warning-mode all

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: YTDLnis-${{ matrix.flavor }}-release
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
          if-no-files-found: error

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push'
    steps:
      - name: Send Telegram Message
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ github.actor }} created commit:
            Commit message: ${{ github.event.head_commit.message }}
            Repository: ${{ github.repository }}
            See changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
